name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The `audio` feature (on by default in the shell and the Python module)
  # pulls in audiopus_sys, which builds the vendored libopus from source with
  # CMake. Its CMakeLists targets an old CMake; let the runners' CMake 4.x
  # configure it.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev

      # libopus's CMake build needs a generator that works without a Visual
      # Studio developer prompt.
      - name: Install Windows CMake generator
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install ninja --no-progress -y
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      # Every crate with its default features. The shell and the Python
      # module enable `audio` and `iostore`, so the engine builds with both.
      - name: Test workspace
        run: cargo test --workspace --all-targets

      # The engine on its own with every feature, including tests gated on
      # features no other crate turns on.
      - name: Test engine (all features)
        run: cargo test -p blam-tags --all-features --lib --tests

      # The optional capabilities must stay optional.
      - name: Build without default features
        run: cargo build -p blam-tag-shell -p blam-tags-py --no-default-features

  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Windows CMake generator
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install ninja --no-progress -y
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      - name: Build and install the wheel
        shell: bash
        run: |
          python -m pip install "maturin>=1.7,<2.0" pytest
          maturin build -m blam-tags-py/Cargo.toml --out dist
          python -m pip install --no-index --find-links dist blam-tags

      # Includes test_shell_parity.py, which checks every Python attribute
      # parity.toml claims for a shell command.
      - name: Test
        run: pytest blam-tags-py/tests

  bindings:
    name: generated bindings are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustdoc's JSON format is unstable; pin the nightly whose
      # format_version the generator reads, and move the pin together with
      # the generator.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-02

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Regenerate
        run: |
          cargo +nightly-2026-07-02 rustdoc -p blam-tags --features audio,iostore -- \
            -Z unstable-options --output-format json
          cargo run -p blam-tags-bindgen

      - name: Fail on a difference
        run: |
          git diff --exit-code -- blam-tags-py/src/generated.rs blam-tags-py/blam_tags.pyi blam-tags-py/COVERAGE.md \
            || { echo "::error::The checked-in bindings are stale; regenerate them (see blam-tags-py/README.md)."; exit 1; }
