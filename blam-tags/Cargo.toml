[package]
name = "blam-tags"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tiff = "0.9"
bcdec_rs = "0.2"
half = "2"
num-traits = "0.2"
num-derive = "0.4"
strum = { version = "0.27", features = ["derive"] }
flate2 = "1"

# `audio` feature: FSB5 sound-bank parsing + FMOD-Vorbis decode (Halo 3+), plus
# classic inline codecs — Ogg Vorbis (CE), Opus + Xbox-ADPCM (H2).
lewton = { version = "0.10", optional = true }
log = { version = "0.4", optional = true }
opus = { version = "0.3", optional = true }
vorbis_rs = { version = "0.5", optional = true }

[features]
audio = ["dep:lewton", "dep:log", "dep:opus", "dep:vorbis_rs"]

[dev-dependencies]
md5 = "0.7"
