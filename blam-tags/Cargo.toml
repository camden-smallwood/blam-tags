[package]
name = "blam-tags"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tiff = "0.9"
bcdec_rs = "0.2"
half = "2"
num-traits = "0.2"
num-derive = "0.4"
strum = { version = "0.27", features = ["derive"] }
flate2 = "1"

# `audio` feature: FSB5 sound-bank parsing + FMOD-Vorbis decode (Halo 3+), plus
# classic inline codecs — Ogg Vorbis (CE), Opus + Xbox-ADPCM (H2).
lewton = { version = "0.10", optional = true }
log = { version = "0.4", optional = true }
opus = { version = "0.3", optional = true }
vorbis_rs = { version = "0.5", optional = true }

# `iostore` feature: read UE5 IoStore containers (.utoc/.ucas) as a virtual
# filesystem, used to mount Halo: Campaign Evolved tags (Reach `.ubulk` tags
# packed into UE5 paks). `oozextract` is a pure-Rust, decode-only Oodle
# (Kraken/Mermaid/…) decompressor; `memmap2` maps the large .ucas partition
# without loading it into memory. The decode+encode `oodle_loader` backend is
# added on top of the same `OodleCodec` trait later, for the write/repack path.
oozextract = { version = "0.5", optional = true }
memmap2 = { version = "0.9", optional = true }
blake3 = { version = "1", optional = true }
# SHA-1 for the empty `.pak` stub's index hashes (UnrealPak footer/index format).
sha1 = { version = "0.10", optional = true }
# Zen-package (.uasset) serialization ported from trumank/retoc (MIT). `anyhow`
# for the ported error handling; `byteorder` for the ported endian read/write
# trait layer.
anyhow = { version = "1", optional = true }
byteorder = { version = "1", optional = true }
# Pure-Rust, decode-only Zstd — decompresses `.usmap` mappings payloads (the
# UE5 reflection schema needed to skip cooked objects' unversioned property
# blocks). Same CI-friendly, no-native-blob philosophy as `oozextract`.
ruzstd = { version = "0.7", optional = true }

[features]
audio = ["dep:lewton", "dep:log", "dep:opus", "dep:vorbis_rs"]
iostore = ["dep:oozextract", "dep:memmap2", "dep:blake3", "dep:anyhow", "dep:byteorder", "dep:sha1", "dep:ruzstd"]


# Each of these mounts a Campaign Evolved IoStore container, so they only build
# with the feature that provides one. Without this, `cargo test --all-targets`
# (which builds every example) fails on a default-feature checkout.
[[example]]
name = "ce_group_census"
required-features = ["iostore"]

[[example]]
name = "ce_new_bare_tag_e2e"
required-features = ["iostore"]

[[example]]
name = "ce_synth_bytes"
required-features = ["iostore"]
