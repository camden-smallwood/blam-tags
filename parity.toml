[cli.extract-bitmap]
gap = "Bitmap extraction (module `bitmap`) is not bound."

[cli.extract-geometry]
gap = "Geometry extraction (modules `extract`, `jms`) is not bound."

[cli.extract-data]
gap = "Data-field extraction (module `extract`) is not bound."

[cli.extract-import-info]
gap = "Import-info extraction (module `extract`) is not bound."

[cli.list-animations]
