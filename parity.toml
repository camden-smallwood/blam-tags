[repl.help]
na = "Shell help; Python uses help() and the .pyi stubs."

[repl."?"]
na = "Alias of `help`."

[repl.exit]
na = "Leaves the shell."

[repl.quit]
na = "Alias of `exit`."

[repl.repl]
na = "Refused inside the REPL."

# ===========================================================================
# Engine capabilities
# ===========================================================================
#
# One `[engine.<area>]` table per capability `blam-tags` offers, whether or
# not the shell has a command for it. Each sets:
#   symbols  = ["blam_tags::...", ...]  public paths that implement it; a
#              path ending in a lowercase name (a function or `Type::method`)
#              is named as a value, anything else is imported. A generic
#              function names its type arguments (`f::<&str>`); one that
#              takes `impl Trait` is coerced to a pointer instead
#              (`f as fn(&'static str) -> _`).
#   features = [...]                    engine features the symbols need
#   shell = ["<subcommand>", ...]  or  shell_gap = "..."
#   python = ["Class.attr", ...]   or  python_gap = "..."
#
# blam-tags/tests/parity_symbols.rs names every symbol in a generated file,
# so renaming or removing one breaks the build until this file is updated.

