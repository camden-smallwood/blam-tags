# What blam-tags can do, and whether the shell and Python can do the same.
#
# counts: 47 engine areas, 15 with no shell command, 32 with no Python binding
# (13 with neither); 37 subcommands, 21 with no Python equivalent.
#
# Three kinds of table:
#
#   [cli.<name>]     every `blam-tag-shell` subcommand
#   [repl."<word>"]  every word the REPL handles itself
#   [engine.<area>]  every engine capability, with or without a command;
#                    see the header of that section for its keys
#
# Tests keep the file honest:
#
#   - blam-tag-shell (`cargo test -p blam-tag-shell`) fails when a subcommand
#     or REPL verb has no entry, when an entry names one that no longer
#     exists, when an engine area names a subcommand that does not exist, or
#     when the counts line above is out of date.
#   - blam-tags (`cargo test -p blam-tags --all-features`) fails to build
#     when an engine symbol is renamed or removed, and fails when its
#     generated symbol file no longer matches this one.
#   - blam-tags-py (`pytest blam-tags-py/tests/test_shell_parity.py`) fails
#     when an attribute listed under `python` is missing from the module.
#
# Each [cli] and [repl] entry sets exactly one of:
#   python = ["Class.method", ...]  the Python attributes that cover it
#   gap    = "..."                  Python cannot do this yet, and why
#   na     = "..."                  the verb has no meaning outside the shell
# and may add `note` for a partial match.

# --- tag files -------------------------------------------------------------

[cli.new]
python = ["TagFile.new"]

[cli.inspect]
python = ["TagFile.read", "TagFile.root", "TagStruct.fields", "TagField.value"]
note = "TagFile.read reads MCC-layout tags only; classic (CE/H2) tags cannot be opened from Python."

