[cli.collision-bsp-test]
gap = "Collision verification (module `collision_verify`) is not bound."

# --- interactive session ---------------------------------------------------

[cli.repl]
na = "An interactive shell; Python is its own REPL."

[repl.open]
python = ["TagFile.read"]

[repl.save]
python = ["TagFile.write", "TagFile.write_atomic"]

[repl.revert]
python = ["TagFile.read"]
note = "Re-read the file; there is no in-place revert."

[repl.close]
na = "A Python TagFile is closed by dropping it."

[repl.edit-block]
python = ["TagStruct.descend"]

[repl.cd]
python = ["TagStruct.descend"]

[repl.back]
na = "Python code keeps its own handles instead of a navigation stack."

[repl.exit-to]
na = "Python code keeps its own handles instead of a navigation stack."

[repl.pwd]
python = ["TagStruct.path"]

[repl.help]
na = "Shell help; Python uses help() and the .pyi stubs."

[repl."?"]
na = "Alias of `help`."

[repl.exit]
na = "Leaves the shell."

[repl.quit]
na = "Alias of `exit`."

[repl.repl]
na = "Refused inside the REPL."
