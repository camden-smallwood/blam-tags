[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "blam-tags"
requires-python = ">=3.8"
description = "Python bindings for blam-tags — Halo tag file reading, writing, and extraction."
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[tool.maturin]
# The extension is the whole package; there is no Python-side wrapper module.
module-name = "blam_tags"
features = ["pyo3/extension-module"]
