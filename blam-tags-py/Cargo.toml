[package]
name = "blam-tags-py"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# Not `blam_tags`: that is the engine's library name, and two libraries of one
# name collide in the build directory. The Python module is still `blam_tags`,
# named by `module-name` in pyproject.toml and by the `#[pymodule]` function.
name = "blam_tags_py"
# `cdylib` is what Python loads; `rlib` keeps the crate testable from Rust.
crate-type = ["cdylib", "rlib"]

# The engine's optional capabilities are on by default so the wheel can reach
# Halo sound and Campaign Evolved IoStore containers; the generated bindings
# are produced from rustdoc built with the same features.
[features]
default = ["audio", "iostore"]
audio = ["blam-tags/audio"]
iostore = ["blam-tags/iostore"]

[dependencies]
blam-tags = { path = "../blam-tags" }
# `abi3-py38` builds one wheel per platform that works on CPython 3.8+,
# instead of one wheel per interpreter version.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }
