[package]
name = "blam-tag-shell"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "blam-tag-shell"
path = "src/main.rs"

# The engine's optional capabilities are on by default so the released CLI can
# reach Halo sound and Campaign Evolved IoStore containers; build with
# `--no-default-features` to leave out their native (Opus) and decompression
# dependencies.
[features]
default = ["audio", "iostore"]
audio = ["blam-tags/audio"]
iostore = ["blam-tags/iostore"]

[dependencies]
blam-tags = { path = "../blam-tags" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
rayon = "1"
rustyline = "14"
shlex = "1"
dirs = "5"
flate2 = "1"
